[project]
name = "copilot"
version = "0.1.0"
description = "Dev Docs Copilot: agentic RAG over a codebase's docs, issues, and PRs"
authors = [
    { name = "pavankalyan-guntuboina", email = "guntuboina.pavan@prezent.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm",
    "fastembed==0.9.0",
    "httpx>=0.28.1",
    "langgraph==1.2.16",
    "langgraph-checkpoint-postgres==3.2.0",
    "openai>=3.35.1",
    "pgvector>=0.5.1",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "spacy>=3.8.16",
    "tenacity>=9.2.1",
    "tiktoken>=0.14.0",
    "typer>=0.27.3",
]


[project.scripts]
copilot = "copilot.cli:app"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: downloads or loads ML models (run with -m slow)"]
addopts = "-m 'not slow'"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
