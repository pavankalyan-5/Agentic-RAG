services:
  db:
    image: paradedb/paradedb:0.26.2-pg18
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
