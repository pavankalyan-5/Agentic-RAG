services:
  db:
    image: paradedb/paradedb:0.26.2-pg18
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot"]
      interval: 2s
      timeout: 3s
      retries: 30

  phoenix:
    # Arize Phoenix: open-source trace viewer. UI + OTLP/HTTP collector on :6006.
    image: arizephoenix/phoenix:version-20.23.0
    ports:
      - "127.0.0.1:6006:6006"
    environment:
      PHOENIX_WORKING_DIR: /phoenix
    volumes:
      - phoenixdata:/phoenix

volumes:
  pgdata:
  phoenixdata:
